# Fall 08 – Eingangsrechnungen prüfen (Voßkamp)
# Start:  cp .env.example .env  &&  docker compose up -d --build
# Oberflächen: n8n http://localhost:5678 · Mailpit (Postfach der Mitarbeitenden) http://localhost:8025
#              Prüfdienst http://localhost:8000/docs

name: fall08

services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vosskamp
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Szenario-Daten (nur lesend): WAVE-Export, ArchivPlus-Index, Handelsregister
      - ${FALL08_DATEN}/companies/a_vosskamp/erp:/seed/erp:ro
      - ${FALL08_DATEN}/companies/a_vosskamp/archivplus/Eingangsrechnungen:/seed/archivplus:ro
      - ${FALL08_DATEN}/world/register:/seed/register:ro
    healthcheck:
      # gesund erst, wenn alle Init-Skripte durch sind (Register geladen)
      test: ["CMD-SHELL", "pg_isready -U postgres -d vosskamp -h localhost && [ \"$$(psql -U postgres -d vosskamp -h localhost -tAc 'select count(*) from ref.register')\" -gt 0 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Kein Port nach außen: nur die Dienste im Stack greifen zu.
    # Zum Ansehen mit TablePlus/DBeaver vorübergehend freigeben:
    # ports: ["127.0.0.1:5433:5432"]

  pruefdienst:
    build: ./pruefdienst
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/vosskamp
      PRUEFDIENST_TOKEN: ${PRUEFDIENST_TOKEN}
      LINK_SECRET: ${LINK_SECRET}
      ENTSCHEIDUNG_URL: ${N8N_PUBLIC_URL}/webhook/entscheidung
      BELEG_URL: ${PRUEFDIENST_PUBLIC_URL}/beleg
      REGISTER_DIR: /seed/register
      BANKS_DIR: /seed/banks
    volumes:
      - dokumente:/data/dokumente
      - ${FALL08_DATEN}/world/register:/seed/register:ro
      - ${FALL08_DATEN}/world/banks:/seed/banks:ro
    ports:
      - "${PRUEFDIENST_PORT:-8000}:8000"   # REST für n8n, MCP (/mcp) für SRW, Belege (/beleg)

  n8n:
    image: n8nio/n8n:2.46.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pruefdienst:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_PUBLIC_URL}/
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL}/
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # keine Verbindungen zu n8n.io (Telemetrie, Update-Hinweise, Vorlagen) – vermeidet ENOTFOUND-Meldungen im Log
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Werte, die die Workflows über $env lesen
      PRUEFDIENST_URL: http://pruefdienst:8000
      PRUEFDIENST_TOKEN: ${PRUEFDIENST_TOKEN}
      PRUEFMODUS: ${PRUEFMODUS}
      SRW_API_URL: ${SRW_API_URL}
      SRW_API_KEY: ${SRW_API_KEY}
      SRW_EXPERT: ${SRW_EXPERT}
      SRW_PROJECT_ID: ${SRW_PROJECT_ID}
      MAIL_ABSENDER: ${MAIL_ABSENDER}
      MAIL_API_URL: http://mailpit:8025/api/v1/send
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/start.sh:/start.sh:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    ports:
      - "5678:5678"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # Weboberfläche: so sehen die Mitarbeitenden die Vorschläge

volumes:
  db-data:
  n8n-data:
  dokumente:
